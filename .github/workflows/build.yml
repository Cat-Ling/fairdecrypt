name: Build and release fairplay-decrypt

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize manual runs so two runs cannot replace the same date tag concurrently.
concurrency:
  group: fairplay-decrypt-manual-release
  cancel-in-progress: false

jobs:
  resolve-upstream:
    name: Resolve upstream revision and release version
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Fetch latest upstream source
        uses: actions/checkout@v7
        with:
          repository: EthanArbuckle/fairplay-decrypt
          ref: main
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve upstream commit
        id: source
        shell: bash
        run: echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate dd.mm.yy release version
        id: version
        shell: bash
        run: echo "version=$(TZ=Asia/Kolkata date +'%d.%m.%y')" >> "$GITHUB_OUTPUT"

  build-source:
    name: Validate Python decryptor and archive source
    runs-on: ubuntu-latest
    needs: resolve-upstream
    steps:
      - name: Checkout pinned upstream revision
        uses: actions/checkout@v7
        with:
          repository: EthanArbuckle/fairplay-decrypt
          ref: ${{ needs.resolve-upstream.outputs.upstream_sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install decryptor dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement upstream/requirements.txt
          python -m pip check

      - name: Validate Python sources and command-line entry points
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/fairplay-pycache
        run: |
          set -euo pipefail

          python -m compileall -q \
            upstream/core.py \
            upstream/decrypt.py \
            upstream/credential-retrieval/native_ssh.py \
            upstream/credential-retrieval/retrieve.py

          # Exercise imports and argparse setup without requiring an IPA or device.
          python upstream/decrypt.py --help >/dev/null
          python upstream/credential-retrieval/retrieve.py --help >/dev/null

          echo "Python decryptor validation passed."

      - name: Clean generated files and archive the source tree
        shell: bash
        run: |
          set -euo pipefail

          # Remove any repository-local environment that may have appeared in source content.
          if find upstream -name .venv -prune -print -quit | grep -q .; then
            echo "::warning::Found a .venv path in the source tree; removing it before packaging."
            find upstream -name .venv -prune -exec rm -rf -- {} +
          fi

          rm -rf upstream/.git upstream/credential-retrieval/build
          find upstream -type d \( \
            -name __pycache__ -o \
            -name .pytest_cache -o \
            -name .mypy_cache -o \
            -name .ruff_cache \
          \) -prune -exec rm -rf -- {} +

          # TAR preserves Unix file modes across GitHub artifact transfer.
          tar -C upstream -cf source-tree.tar .
          tar -tf source-tree.tar | sed -n '1,100p'

      - name: Upload source-tree TAR
        uses: actions/upload-artifact@v7
        with:
          name: source-tree-tar
          path: source-tree.tar
          if-no-files-found: error
          retention-days: 1

  build-ios:
    name: Cross-compile iOS credential-retrieval bundle
    runs-on: macos-latest
    needs: resolve-upstream
    steps:
      - name: Checkout pinned upstream revision
        uses: actions/checkout@v7
        with:
          repository: EthanArbuckle/fairplay-decrypt
          ref: ${{ needs.resolve-upstream.outputs.upstream_sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - name: Install ldid
        shell: bash
        run: brew list --formula ldid >/dev/null 2>&1 || brew install ldid

      - name: Build iOS credential-retrieval bundle with upstream Makefile
        shell: bash
        run: |
          set -euo pipefail
          make -C upstream/credential-retrieval bundle

          bundle='upstream/credential-retrieval/build/bundle'
          for item in credential.ios driver.ios trigger.ios static-key-table.bin core4-word-table.bin; do
            if [[ ! -s "$bundle/$item" ]]; then
              echo "::error::Upstream Makefile did not produce $bundle/$item"
              echo 'Bundle directory contents:'
              find upstream/credential-retrieval/build -maxdepth 5 -print 2>/dev/null || true
              exit 1
            fi
          done

          file "$bundle/credential.ios" "$bundle/driver.ios" "$bundle/trigger.ios"

      - name: Stage bundle and archive it with file modes preserved
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p payload/credential-retrieval/build
          cp -a upstream/credential-retrieval/build/bundle payload/credential-retrieval/build/
          tar -C payload -cf ios-credential-bundle.tar .
          tar -tf ios-credential-bundle.tar

      - name: Upload iOS credential bundle TAR
        uses: actions/upload-artifact@v7
        with:
          name: ios-credential-bundle-tar
          path: ios-credential-bundle.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Package ZIP and replace date-matched release
    runs-on: ubuntu-latest
    needs: [resolve-upstream, build-source, build-ios]
    steps:
      - name: Download source and iOS bundle TARs
        uses: actions/download-artifact@v8
        with:
          pattern: '*-tar'
          path: dist/artifacts
          merge-multiple: true

      - name: Create release ZIP and validate its actual contents
        id: package
        shell: bash
        env:
          VERSION: ${{ needs.resolve-upstream.outputs.version }}
          UPSTREAM_SHA: ${{ needs.resolve-upstream.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          payload="dist/fairplay-decrypt-${VERSION}"
          zip_path="dist/fairplay-decrypt-${VERSION}.zip"
          entries_file="$RUNNER_TEMP/fairplay-decrypt-zip-entries.txt"

          mkdir -p "$payload"
          test -s dist/artifacts/source-tree.tar
          test -s dist/artifacts/ios-credential-bundle.tar
          tar -xf dist/artifacts/source-tree.tar -C "$payload"
          tar -xf dist/artifacts/ios-credential-bundle.tar -C "$payload"

          # Validate the new pure-Python source layout before creating the ZIP.
          required_files=(
            README.md
            Makefile
            core.py
            decrypt.py
            requirements.txt
            credential-retrieval/Makefile
            credential-retrieval/README.md
            credential-retrieval/native_ssh.py
            credential-retrieval/retrieve.py
          )
          for item in "${required_files[@]}"; do
            if [[ ! -s "$payload/$item" ]]; then
              echo "::error::Release payload is missing required source file: $item"
              find "$payload" -maxdepth 4 -type f -print | sort
              exit 1
            fi
          done

          bundle="$payload/credential-retrieval/build/bundle"
          for item in credential.ios driver.ios trigger.ios static-key-table.bin core4-word-table.bin; do
            if [[ ! -s "$bundle/$item" ]]; then
              echo "::error::Missing expected upstream bundle output: $bundle/$item"
              echo 'Credential-retrieval build tree:'
              find "$payload/credential-retrieval" -maxdepth 6 -print 2>/dev/null | sort || true
              exit 1
            fi
          done

          # Remove generated caches and metadata, but preserve the built iOS bundle.
          if find "$payload" -name .venv -print -quit | grep -q .; then
            echo "::warning::Found a .venv path in the merged payload; removing it before creating the release ZIP."
            find "$payload" -name .venv -prune -exec rm -rf -- {} +
          fi
          find "$payload" -type d \( \
            -name __pycache__ -o \
            -name .pytest_cache -o \
            -name .mypy_cache -o \
            -name .ruff_cache \
          \) -prune -exec rm -rf -- {} +
          find "$payload" -name .git -prune -exec rm -rf -- {} +

          cat > "$payload/BUILD-INFO.txt" <<EOF
          Upstream: https://github.com/EthanArbuckle/fairplay-decrypt
          Upstream commit: ${UPSTREAM_SHA}
          Upstream commit URL: https://github.com/EthanArbuckle/fairplay-decrypt/commit/${UPSTREAM_SHA}
          Release version: ${VERSION}
          Version date timezone: Asia/Kolkata

          decrypt.py and core.py: pure-Python IPA decryptor; install dependencies from requirements.txt.
          credential-retrieval/build/bundle/: iOS ARM64 programs and data tables built with the upstream credential-retrieval Makefile on macos-latest.

          Includes the upstream source tree. Git metadata, Python bytecode caches, and virtual environments are excluded.
          EOF

          mkdir -p dist
          rm -f "$zip_path"
          (cd dist && zip -qr "$(basename "$zip_path")" "$(basename "$payload")" \
            -x '*/.venv' '*/.venv/*' '*/.venv/**' \
               '*/__pycache__/*' '*/.pytest_cache/*' '*/.mypy_cache/*' '*/.ruff_cache/*' '*/.git/*')
          test -s "$zip_path"
          unzip -Z1 "$zip_path" > "$entries_file"

          # Match path suffixes instead of requiring a particular ZIP root prefix.
          require_zip_entry() {
            local pattern="$1"
            local label="$2"
            if ! grep -Eq "$pattern" "$entries_file"; then
              echo "::error::Release ZIP is missing required entry: $label"
              echo 'ZIP entries relevant to the release payload:'
              grep -E '(^|/)(README[.]md|Makefile|core[.]py|decrypt[.]py|requirements[.]txt|credential-retrieval/.*|credential-retrieval/build/bundle/[^/]+)$' "$entries_file" || true
              echo 'First 200 ZIP entries:'
              sed -n '1,200p' "$entries_file"
              exit 1
            fi
          }

          require_zip_entry '^[^/]+/README[.]md$' 'README.md'
          require_zip_entry '^[^/]+/Makefile$' 'Makefile'
          require_zip_entry '^[^/]+/core[.]py$' 'core.py'
          require_zip_entry '^[^/]+/decrypt[.]py$' 'decrypt.py'
          require_zip_entry '^[^/]+/requirements[.]txt$' 'requirements.txt'
          require_zip_entry '^[^/]+/credential-retrieval/native_ssh[.]py$' 'credential-retrieval/native_ssh.py'
          require_zip_entry '^[^/]+/credential-retrieval/retrieve[.]py$' 'credential-retrieval/retrieve.py'
          require_zip_entry '^[^/]+/credential-retrieval/build/bundle/credential[.]ios$' 'credential-retrieval/build/bundle/credential.ios'
          require_zip_entry '^[^/]+/credential-retrieval/build/bundle/driver[.]ios$' 'credential-retrieval/build/bundle/driver.ios'
          require_zip_entry '^[^/]+/credential-retrieval/build/bundle/trigger[.]ios$' 'credential-retrieval/build/bundle/trigger.ios'
          require_zip_entry '^[^/]+/credential-retrieval/build/bundle/static-key-table[.]bin$' 'credential-retrieval/build/bundle/static-key-table.bin'
          require_zip_entry '^[^/]+/credential-retrieval/build/bundle/core4-word-table[.]bin$' 'credential-retrieval/build/bundle/core4-word-table.bin'

          # A residual venv should never abort the release; exclusions normally remove it.
          if grep -Eq '(^|/)\.venv(/|$)' "$entries_file"; then
            echo "::warning::The release ZIP contains a .venv path despite cleanup/exclusions; publishing continues."
            grep -E '(^|/)\.venv(/|$)' "$entries_file" | sed -n '1,30p' || true
          fi

          echo 'Verified release ZIP entries:'
          grep -E '(^|/)(README[.]md|Makefile|core[.]py|decrypt[.]py|requirements[.]txt|credential-retrieval/build/bundle/[^/]+)$' "$entries_file" || true
          echo "zip_path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Replace existing release/tag and publish ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.resolve-upstream.outputs.version }}
          UPSTREAM_SHA: ${{ needs.resolve-upstream.outputs.upstream_sha }}
        run: |
          set -euo pipefail
          release_api="repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}"
          tag_api="repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}"

          if gh api "$release_api" >/dev/null 2>&1; then
            echo "Deleting existing release ${VERSION} and its tag."
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          elif gh api "$tag_api" >/dev/null 2>&1; then
            echo "Deleting orphaned tag ${VERSION}."
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${VERSION}"
          fi

          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Automated build of [EthanArbuckle/fairplay-decrypt](https://github.com/EthanArbuckle/fairplay-decrypt) at commit [\`${UPSTREAM_SHA}\`](https://github.com/EthanArbuckle/fairplay-decrypt/commit/${UPSTREAM_SHA}).

          The ZIP contains the upstream source tree, the pure-Python decryptor (`decrypt.py` and `core.py`), its `requirements.txt`, and the Xcode-built iOS ARM64 credential-retrieval bundle. Git metadata, Python bytecode caches, and virtual environments are excluded.
          EOF

          gh release create "$VERSION" \
            "dist/fairplay-decrypt-${VERSION}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --target "$GITHUB_SHA"
